name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          # Ni sounddevice ni gpiozero : la suite tourne entierement sur les
          # doubles factices, ce qui est justement ce qu'on veut verifier.
          pip install numpy httpx pytest ruff
      - run: ruff check src tests
      - run: python -m pytest -q
