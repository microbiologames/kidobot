[project]
name = "kidobot"
version = "0.1.0"
description = "Boite a questions vocale pour enfants : un bouton, une question, une reponse parlee."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "webrtcvad>=2.0.10",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Reconnaissance vocale locale (CTranslate2 - tourne bien sur ARM64).
stt = ["faster-whisper>=1.0"]
# Backend LLM distant (repli wifi).
cloud = ["anthropic>=1.0"]
# GPIO : uniquement sur Raspberry Pi.
pi = ["gpiozero>=2.0", "lgpio>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kidobot = "kidobot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLW"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
